spring:
  application:
    name: factory-central-server
  datasource:
    url: jdbc:postgresql://${FACTORY_DB_HOST:localhost}:${FACTORY_DB_PORT:5432}/${FACTORY_DB_NAME:argos_factory}
    username: ${FACTORY_DB_USERNAME:argos_factory}
    password: ${FACTORY_DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

server:
  port: ${FACTORY_SERVER_PORT:8081}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

